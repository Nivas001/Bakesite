<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="60%" stop-color="#FCE7EC" />
      <stop offset="100%" stop-color="#F7D0D8" />
    </radialGradient>
    <linearGradient id="berryG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="tierG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F3" />
      <stop offset="50%" stop-color="#F4A7B9" />
      <stop offset="100%" stop-color="#E87A90" />
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <filter id="dropSh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2C1810" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgG)" />
  <rect width="576" height="576" x="12" y="12" rx="32" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.25" />

  <!-- Stand -->
  <g filter="url(#dropSh)">
    <path d="M 240 470 L 360 470 L 340 445 L 260 445 Z" fill="#3D2217" />
    <ellipse cx="300" cy="445" rx="190" ry="26" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3" />
  </g>

  <!-- Bottom Tier -->
  <g filter="url(#dropSh)">
    <path d="M 160 335 Q 160 415 300 415 Q 440 415 440 335 L 440 290 Q 300 335 160 290 Z" fill="url(#tierG)" />
    <path d="M 160 290 
             C 180 320, 200 320, 220 290 
             C 240 325, 260 325, 280 290 
             C 300 330, 320 330, 340 290 
             C 360 325, 380 325, 400 290 
             C 420 320, 435 320, 440 290 
             L 440 270 Q 300 310 160 270 Z" fill="#FFFFFF" />
  </g>

  <!-- Top Tier -->
  <g filter="url(#dropSh)">
    <path d="M 210 245 Q 210 315 300 315 Q 390 315 390 245 L 390 205 Q 300 240 210 205 Z" fill="url(#tierG)" />
    <path d="M 210 205 
             C 230 235, 250 235, 270 205 
             C 290 240, 310 240, 330 205 
             C 350 235, 370 235, 390 205 
             L 390 190 Q 300 220 210 190 Z" fill="#FFFFFF" />
    <ellipse cx="300" cy="190" rx="90" ry="26" fill="#FFFFFF" stroke="#FCE7EC" stroke-width="2" />
  </g>

  <!-- Berries -->
  <ellipse cx="265" cy="175" rx="16" ry="20" fill="url(#berryG)" />
  <circle cx="261" cy="168" r="3.5" fill="#FFFFFF" opacity="0.6" />
  <ellipse cx="335" cy="175" rx="16" ry="20" fill="url(#berryG)" />
  <circle cx="331" cy="168" r="3.5" fill="#FFFFFF" opacity="0.6" />

  <!-- Candle -->
  <rect x="294" y="115" width="12" height="58" rx="4" fill="#E11D48" stroke="#FFFFFF" stroke-width="2" />
  <line x1="300" y1="115" x2="300" y2="103" stroke="#2C1810" stroke-width="3" stroke-linecap="round" />
  <path d="M 300 65 C 286 88, 288 100, 300 104 C 312 100, 314 88, 300 65 Z" fill="url(#goldG)" />

  <!-- Text -->
  <text x="300" y="530" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#2C1810" letter-spacing="3">ANI BAKES ATELIER</text>
  <text x="300" y="556" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9F1239" letter-spacing="1">FRESH SMALL-BATCH BAKERY</text>
</svg>
